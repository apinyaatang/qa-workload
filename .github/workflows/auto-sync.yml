name: Auto Sync ADO → Supabase

on:
  schedule:
    # GitHub รัน schedule ช้ากว่าที่ตั้งราว 7 ชม. (วัดจริง 19–23/11/2026) จึงเริ่มตั้งแต่กลางดึก
    # 3 รอบ เพื่อให้อย่างน้อย 1 รอบเสร็จก่อน 09:00 — รันซ้ำได้ไม่มีผลเสีย ค่าล่าสุดเขียนทับ
    # เวลาใน cron เป็น UTC · เลี่ยงนาทีที่ 0 เพราะคิวแน่นที่สุด
    - cron: '7 17 * * *'    # 00:07 Bangkok (UTC+7) ทุกวัน
    - cron: '7 19 * * *'    # 02:07 Bangkok
    - cron: '7 21 * * *'    # 04:07 Bangkok
  workflow_dispatch:          # กด Run manually ได้ด้วยจากหน้า GitHub Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run ADO sync
        env:
          ADO_ORG_URL:       ${{ secrets.ADO_ORG_URL }}
          ADO_PROJECT:       ${{ secrets.ADO_PROJECT }}
          ADO_PAT:           ${{ secrets.ADO_PAT }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/sync-ado.mjs
