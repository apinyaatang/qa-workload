name: Auto Sync ADO → Supabase

on:
  schedule:
    # GitHub มักรัน schedule ช้ากว่าเวลาที่ตั้ง (ยิ่งตรงต้นชั่วโมงยิ่งช้า) จึงตั้งไว้ 2 รอบก่อน 09:00
    # และเลี่ยงนาทีที่ 0 — รันซ้ำได้ไม่มีผลเสีย ข้อมูลถูกเขียนทับด้วยค่าล่าสุด
    - cron: '7 0 * * *'     # 07:07 Bangkok (UTC+7) ทุกวัน
    - cron: '37 0 * * *'    # 07:37 Bangkok สำรอง
  workflow_dispatch:          # กด Run manually ได้ด้วยจากหน้า GitHub Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run ADO sync
        env:
          ADO_ORG_URL:       ${{ secrets.ADO_ORG_URL }}
          ADO_PROJECT:       ${{ secrets.ADO_PROJECT }}
          ADO_PAT:           ${{ secrets.ADO_PAT }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/sync-ado.mjs
